name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # A throwaway Postgres for the integration suite. Those tests apply the real
    # migration chain from empty and exercise the constraints and RLS policies —
    # the parts the app relies on but cannot verify in JavaScript.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: clinic_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Guard against the whole route tree silently vanishing from the repo.
      # This already happened once (commit 19268ea): an unreadable directory
      # made `git add -A` record every app/ and public/ file as deleted, and
      # `git status` reported clean afterwards. `pnpm build` catches a missing
      # app/ too, but only after ~2 minutes of setup — and not the assets.
      - name: Verify tracked file tree
        run: |
          fail=0
          for f in app/layout.tsx app/globals.css app/manifest.ts \
                   "app/(public)/page.tsx" "app/(portal)/portal/page.tsx" \
                   "app/(admin)/admin/page.tsx" app/api/cron/reminders/route.ts \
                   public/icon.svg public/sw.js; do
            if ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error file=$f::Not tracked by git — the route tree is incomplete."
              fail=1
            fi
          done
          exit $fail

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Integration tests (migrations, constraints, RLS)
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:55433/clinic_test

      # NOTE: deliberately no `pnpm launch-check` step. That audits a real
      # clinic deployment, and this repo's active clinic is a sample — whose
      # ".example" contact address and starter icons it correctly flags. Run it
      # against a real clinic before deploying, not against the template.
      - name: Build
        run: pnpm build
        env:
          # Build doesn't query the DB (pages render at request time); dummy
          # public keys keep any client-bundle inlining happy.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
